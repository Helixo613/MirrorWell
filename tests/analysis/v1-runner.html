<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MirrorWell V1 fixture runner</title>
  </head>
  <body>
    <p id="status">idle</p>
    <video id="video" playsinline muted></video>
    <script type="module">
      /**
       * Headless V1 sampler (docs/MODEL_AND_DATA.md §7 / Task B7).
       * Loads bundled MediaPipe from /wasm + /models (same-origin only — no CDN).
       * Exposed as window.__v1 for Playwright control via scripts/run-v1.mjs --sample.
       *
       * Protocol fixture naming (preferred):
       *   fixture_<subjectId>_<condition>_<trial>.mp4
       *   conditions: neutral | smile | yaw_left | yaw_right | low_light | distance_2m
       *   trials: 1 | 2
       *
       * Each QUALITY_OK row records measured yawDeg from headPose (operator label is not
       * evidence). Metric formulas live in scripts/v1-protocol.mjs — this page only samples.
       *
       * NOTE: regionDistances still uses a scalar path for offline debugging. Production
       * geometry is the face-local vector kernel (src/sensing/geometry.ts). Full V1 PASS
       * evidence must use production metrics or an updated sampler that matches them.
       */
      import { FaceLandmarker, FilesetResolver } from '/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs';

      // Landmark indices mirrored from src/config/exercises.ts (REGION_MOUTH_CORNER for smile V1).
      const REGIONS = {
        REGION_BROW: { left: [105, 159], right: [334, 386] },
        REGION_EYELID: { left: [159, 145], right: [386, 374] },
        REGION_MOUTH_CORNER: { left: [291, 1], right: [61, 1] },
        REGION_LIP: { left: [308, 13], right: [78, 13] },
      };
      const LEFT_EYE = 33;
      const RIGHT_EYE = 263;
      const LUMA_MIN = 60;
      const INTER_OCULAR_MIN_PX = 60;
      const POSE_MAX_DEG = 15;
      const MOVEMENT_FLOOR = 0.008;

      const statusEl = document.getElementById('status');
      const video = document.getElementById('video');
      let landmarker = null;
      // VIDEO mode requires strictly increasing timestamps for the life of the landmarker.
      let nextTimestampMs = 1;

      function setStatus(s) {
        statusEl.textContent = s;
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = a.z - b.z;
        return Math.sqrt(dx * dx + dy * dy + dz * dz);
      }

      function meanLuma64() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        if (!ctx) return 255;
        ctx.drawImage(video, 0, 0, 64, 64);
        const { data } = ctx.getImageData(0, 0, 64, 64);
        let sum = 0;
        for (let i = 0; i < data.length; i += 4) {
          sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        }
        return sum / (data.length / 4);
      }

      function poseAnglesDeg(m) {
        // Facial transformation matrix → approximate yaw/pitch/roll (degrees).
        if (!m || m.length < 16) return { yaw: 0, pitch: 0, roll: 0 };
        const r00 = m[0], r01 = m[1], r02 = m[2];
        const r10 = m[4], r11 = m[5], r12 = m[6];
        const r20 = m[8], r21 = m[9], r22 = m[10];
        const pitch = Math.atan2(-r20, Math.sqrt(r00 * r00 + r10 * r10));
        const yaw = Math.atan2(r10, r00);
        const roll = Math.atan2(r21, r22);
        const toDeg = 180 / Math.PI;
        return { yaw: yaw * toDeg, pitch: pitch * toDeg, roll: roll * toDeg };
      }

      function qualityState(lf) {
        if (!lf.facePresent) return 'FACE_LOST';
        const luma = meanLuma64();
        if (luma < LUMA_MIN) return 'LOW_LIGHT';
        const left = lf.landmarks[LEFT_EYE];
        const right = lf.landmarks[RIGHT_EYE];
        if (!left || !right) return 'FACE_LOST';
        const iodPx = dist(
          { x: left.x * video.videoWidth, y: left.y * video.videoHeight, z: 0 },
          { x: right.x * video.videoWidth, y: right.y * video.videoHeight, z: 0 },
        );
        if (iodPx < INTER_OCULAR_MIN_PX) return 'TOO_FAR';
        const { yaw, pitch, roll } = poseAnglesDeg(lf.headPose);
        if (Math.abs(yaw) > POSE_MAX_DEG || Math.abs(pitch) > POSE_MAX_DEG || Math.abs(roll) > POSE_MAX_DEG) {
          return 'POSE_OUT_OF_RANGE';
        }
        return 'QUALITY_OK';
      }

      function inverseRotateAround(point, center, headPose) {
        const r = (row, col) => headPose[row * 4 + col] ?? (row === col ? 1 : 0);
        const x = point.x - center.x;
        const y = point.y - center.y;
        const z = point.z - center.z;
        return {
          x: center.x + (r(0, 0) * x + r(1, 0) * y + r(2, 0) * z),
          y: center.y + (r(0, 1) * x + r(1, 1) * y + r(2, 1) * z),
          z: center.z + (r(0, 2) * x + r(1, 2) * y + r(2, 2) * z),
        };
      }

      function sideDistance(landmarks, indices, interOcular, headPose, center) {
        const a = landmarks[indices[0]];
        const b = landmarks[indices[1]];
        if (!a || !b) return 0;
        const aR = inverseRotateAround(a, center, headPose);
        const bR = inverseRotateAround(b, center, headPose);
        return dist(aR, bR) / interOcular;
      }

      function regionDistances(lf) {
        const leftEye = lf.landmarks[LEFT_EYE];
        const rightEye = lf.landmarks[RIGHT_EYE];
        const interOcular = leftEye && rightEye ? dist(leftEye, rightEye) || 1 : 1;
        const center =
          leftEye && rightEye
            ? {
                x: (leftEye.x + rightEye.x) / 2,
                y: (leftEye.y + rightEye.y) / 2,
                z: (leftEye.z + rightEye.z) / 2,
              }
            : { x: 0.5, y: 0.5, z: 0 };
        const out = {};
        for (const [regionId, pair] of Object.entries(REGIONS)) {
          out[regionId] = {
            left: sideDistance(lf.landmarks, pair.left, interOcular, lf.headPose, center),
            right: sideDistance(lf.landmarks, pair.right, interOcular, lf.headPose, center),
          };
        }
        return out;
      }

      function symmetryIndex(left, right) {
        const dL = Math.abs(left);
        const dR = Math.abs(right);
        const m = Math.max(dL, dR);
        if (m < MOVEMENT_FLOOR) return null;
        return Math.min(dL, dR) / m;
      }

      async function init() {
        setStatus('init');
        const fileset = await FilesetResolver.forVisionTasks('/wasm');
        try {
          landmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate: 'GPU' },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFacialTransformationMatrixes: true,
            minFaceDetectionConfidence: 0.5,
            minFacePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
        } catch {
          landmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate: 'CPU' },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFacialTransformationMatrixes: true,
            minFaceDetectionConfidence: 0.5,
            minFacePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
        }
        setStatus('ready');
        return true;
      }

      async function sampleVideo(url, sampleEveryMs = 100) {
        if (!landmarker) throw new Error('not initialized');
        setStatus('loading ' + url);
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        await new Promise((resolve, reject) => {
          video.onloadeddata = () => resolve();
          video.onerror = () => reject(new Error('video load failed: ' + url));
        });
        await video.play();

        const rows = [];
        let t = 0;
        const durationMs = (video.duration || 0) * 1000;
        // Seek-sample rather than real-time play (faster, deterministic).
        video.pause();
        while (t <= durationMs) {
          await new Promise((resolve) => {
            const onSeeked = () => {
              video.removeEventListener('seeked', onSeeked);
              resolve();
            };
            video.addEventListener('seeked', onSeeked);
            video.currentTime = Math.min(t / 1000, Math.max(0, video.duration - 0.001));
          });

          // Monotonic clock for MediaPipe VIDEO mode (not video currentTime).
          const timestampMs = nextTimestampMs;
          nextTimestampMs += sampleEveryMs;
          let result;
          try {
            result = landmarker.detectForVideo(video, timestampMs);
          } catch (err) {
            rows.push({
              timestampMs: t,
              qualityState: 'FACE_LOST',
              facePresent: false,
              regions: null,
              symmetryIndex: null,
              error: String(err?.message ?? err),
            });
            t += sampleEveryMs;
            continue;
          }

          const faceLandmarks = result.faceLandmarks[0] ?? [];
          const matrix = result.facialTransformationMatrixes[0]?.data ?? [];
          const lf = {
            landmarks: faceLandmarks.map((p) => ({ x: p.x, y: p.y, z: p.z })),
            headPose: Array.from(matrix),
            facePresent: faceLandmarks.length > 0,
            timestampMs: t,
          };
          const pose = poseAnglesDeg(lf.headPose);
          const q = qualityState(lf);
          if (q !== 'QUALITY_OK') {
            rows.push({
              timestampMs: t,
              qualityState: q,
              facePresent: lf.facePresent,
              regions: null,
              symmetryIndex: null,
              yawDeg: pose.yaw,
              pitchDeg: pose.pitch,
              rollDeg: pose.roll,
              maxDisp: null,
            });
          } else {
            const regions = regionDistances(lf);
            const mouth = regions.REGION_MOUTH_CORNER;
            const maxDisp = Math.max(Math.abs(mouth.left), Math.abs(mouth.right));
            rows.push({
              timestampMs: t,
              qualityState: q,
              facePresent: true,
              regions,
              symmetryIndex: symmetryIndex(mouth.left, mouth.right),
              mouthLeft: mouth.left,
              mouthRight: mouth.right,
              mouthDisp: maxDisp,
              maxDisp,
              yawDeg: pose.yaw,
              pitchDeg: pose.pitch,
              rollDeg: pose.roll,
            });
          }
          t += sampleEveryMs;
        }

        setStatus('done ' + url);
        return {
          url,
          durationMs,
          width: video.videoWidth,
          height: video.videoHeight,
          rows,
        };
      }

      window.__v1 = { init, sampleVideo };
      setStatus('script-loaded');
    </script>
  </body>
</html>
