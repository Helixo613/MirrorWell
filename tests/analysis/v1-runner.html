<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MirrorWell V1 fixture runner</title>
  </head>
  <body>
    <p id="status">idle</p>
    <video id="video" playsinline muted></video>
    <script type="module">
      /**
       * Headless V1 sampler (docs/MODEL_AND_DATA.md §7 / Task B7).
       * Loads bundled MediaPipe from /wasm + /models (same-origin only; no CDN).
       * Exposed as window.__v1 for Playwright control via scripts/run-v1.mjs --sample.
       *
       * Protocol fixture naming (preferred):
       *   fixture_<subjectId>_<condition>_<trial>.mp4
       *   conditions: neutral | smile | yaw_left | yaw_right | low_light | distance_2m
       *   trials: 1 | 2
       *
       * Each QUALITY_OK row records measured yawDeg from headPose (operator label is not
       * evidence). Metric formulas live in scripts/v1-protocol.mjs; this page only samples.
       *
       * Measurement core mirrors production verbatim: quality gates + euler extraction
       * from src/sensing/quality.ts, face-local vector kernel from src/metrics/geometry.ts.
       * Rows carry absolute features; scripts/run-v1.mjs derives per-trial displacement/SI.
       */
      import { FaceLandmarker, FilesetResolver } from '/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs';

      // ---------------------------------------------------------------------------
      // Measurement core, VERBATIM ports of the production pipeline (candidate-2):
      //   pose/quality: src/sensing/quality.ts   kernel: src/metrics/geometry.ts
      // Rows emit absolute face-local features only; displacement/SI derivation happens
      // in scripts/run-v1.mjs so neutral baselines are per-trial (MODEL_AND_DATA §7).
      // ---------------------------------------------------------------------------

      // Canonical mesh indices (anatomical = subject's side), src/metrics/geometry.ts.
      const EYE_R_OUTER = 33, EYE_L_OUTER = 263, EYE_R_INNER = 133, EYE_L_INNER = 362;
      const BROW_L = 334, BROW_R = 105;
      const LID_UPPER_L = 386, LID_LOWER_L = 374, LID_UPPER_R = 159, LID_LOWER_R = 145;
      const MOUTH_L = 291, MOUTH_R = 61, LIP_L = 308, LIP_R = 78;

      // Mirrors src/config/thresholds.ts qualityGates + metrics.smoothingWindow.
      const LUMA_MIN = 60;
      const INTER_OCULAR_MIN_FRAC = 0.09;
      const POSE_MAX_DEG = 15;
      const JITTER_MAX_PCT = 0.005;
      const JITTER_WINDOW = 5;
      const FACE_BBOX_MARGIN = 0.1;
      const LUMA_DOWNSAMPLE = 64;

      const statusEl = document.getElementById('status');
      const video = document.getElementById('video');
      let landmarker = null;
      // VIDEO mode requires strictly increasing timestamps for the life of the landmarker.
      let nextTimestampMs = 1;

      function setStatus(s) {
        statusEl.textContent = s;
      }

      // --- pose (ZYX Tait-Bryan, row-major 4x4); mirrors quality.ts extractEulerAnglesDeg ---
      function poseAnglesDeg(m) {
        if (!m || m.length < 16) return { yaw: 0, pitch: 0, roll: 0 };
        const r = (row, col) => m[row * 4 + col] ?? 0;
        const pitch = Math.atan2(r(2, 1), r(2, 2));
        const yaw = Math.atan2(-r(2, 0), Math.sqrt(r(2, 1) ** 2 + r(2, 2) ** 2));
        const roll = Math.atan2(r(1, 0), r(0, 0));
        const toDeg = 180 / Math.PI;
        return { yaw: yaw * toDeg, pitch: pitch * toDeg, roll: roll * toDeg };
      }

      // --- face-region luma, mirrors quality.ts faceRegionLuma64 ---
      function faceRegionLuma64(landmarks) {
        const canvas = document.createElement('canvas');
        canvas.width = LUMA_DOWNSAMPLE;
        canvas.height = LUMA_DOWNSAMPLE;
        const ctx = canvas.getContext('2d');
        if (!ctx) return 255;
        ctx.drawImage(video, 0, 0, LUMA_DOWNSAMPLE, LUMA_DOWNSAMPLE);
        const { data } = ctx.getImageData(0, 0, LUMA_DOWNSAMPLE, LUMA_DOWNSAMPLE);
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of landmarks) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }
        if (!Number.isFinite(minX)) return 255;
        const padX = (maxX - minX) * FACE_BBOX_MARGIN;
        const padY = (maxY - minY) * FACE_BBOX_MARGIN;
        minX = Math.max(0, minX - padX); maxX = Math.min(1, maxX + padX);
        minY = Math.max(0, minY - padY); maxY = Math.min(1, maxY + padY);
        let x0 = Math.floor(minX * LUMA_DOWNSAMPLE), x1 = Math.ceil(maxX * LUMA_DOWNSAMPLE);
        let y0 = Math.floor(minY * LUMA_DOWNSAMPLE), y1 = Math.ceil(maxY * LUMA_DOWNSAMPLE);
        if (x1 <= x0) { x0 = Math.max(0, Math.min(LUMA_DOWNSAMPLE - 1, x0)); x1 = x0 + 1; }
        if (y1 <= y0) { y0 = Math.max(0, Math.min(LUMA_DOWNSAMPLE - 1, y0)); y1 = y0 + 1; }
        x0 = Math.max(0, x0); y0 = Math.max(0, y0);
        x1 = Math.min(LUMA_DOWNSAMPLE, x1); y1 = Math.min(LUMA_DOWNSAMPLE, y1);
        if (x0 >= x1 || y0 >= y1) return 255;
        let sum = 0, count = 0;
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            const i = (y * LUMA_DOWNSAMPLE + x) * 4;
            sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            count++;
          }
        }
        return count === 0 ? 255 : sum / count;
      }

      function interOcularDistancePx(landmarks, W, H) {
        const left = landmarks[EYE_L_OUTER];
        const right = landmarks[EYE_R_OUTER];
        if (!left || !right) return 0;
        const dx = (left.x - right.x) * W;
        const dy = (left.y - right.y) * H;
        return Math.sqrt(dx * dx + dy * dy);
      }

      // --- jitter (RMS second difference / IOD), mirrors quality.ts rollingJitterSecondDiff.
      // Sampling interval is 100 ms (vs ~33 ms live); second difference still cancels
      // constant-velocity motion, so the same threshold applies. Reset per video + on non-OK.
      let prevLandmarks = null, prevPrevLandmarks = null, jitterHistory = [];
      function resetJitterState() {
        prevLandmarks = null;
        prevPrevLandmarks = null;
        jitterHistory = [];
      }
      function rollingJitterSecondDiff(landmarks, interOcularPx, W, H) {
        if (!prevLandmarks || !prevPrevLandmarks || prevLandmarks.length !== landmarks.length || interOcularPx === 0) {
          prevPrevLandmarks = prevLandmarks;
          prevLandmarks = landmarks;
          if (!prevPrevLandmarks) jitterHistory = [];
          return 0;
        }
        let sumSq = 0;
        for (let i = 0; i < landmarks.length; i++) {
          const ax = (landmarks[i].x - 2 * prevLandmarks[i].x + prevPrevLandmarks[i].x) * W;
          const ay = (landmarks[i].y - 2 * prevLandmarks[i].y + prevPrevLandmarks[i].y) * H;
          sumSq += ax * ax + ay * ay;
        }
        const rmsPx = Math.sqrt(sumSq / landmarks.length);
        const displacementPct = rmsPx / interOcularPx;
        prevPrevLandmarks = prevLandmarks;
        prevLandmarks = landmarks;
        jitterHistory.push(displacementPct);
        if (jitterHistory.length > JITTER_WINDOW) jitterHistory.shift();
        return jitterHistory.reduce((a, b) => a + b, 0) / jitterHistory.length;
      }

      // --- quality gates, production order (quality.ts evaluate) ---
      function qualityState(lf, W, H) {
        if (!lf.facePresent) {
          resetJitterState();
          return 'FACE_LOST';
        }
        const luma = faceRegionLuma64(lf.landmarks);
        if (luma < LUMA_MIN) {
          resetJitterState();
          return 'LOW_LIGHT';
        }
        const interOcular = interOcularDistancePx(lf.landmarks, W, H);
        if (interOcular < INTER_OCULAR_MIN_FRAC * W) {
          resetJitterState();
          return 'TOO_FAR';
        }
        const { yaw, pitch, roll } = poseAnglesDeg(lf.headPose);
        if (Math.abs(yaw) > POSE_MAX_DEG || Math.abs(pitch) > POSE_MAX_DEG || Math.abs(roll) > POSE_MAX_DEG) {
          resetJitterState();
          return 'POSE_OUT_OF_RANGE';
        }
        const jitter = rollingJitterSecondDiff(lf.landmarks, interOcular, W, H);
        if (jitter > JITTER_MAX_PCT) {
          return 'LOW_CONFIDENCE';
        }
        return 'QUALITY_OK';
      }

      // --- face-local vector kernel, mirrors geometry.ts measureAbsolute ---
      function measureAbsolutePx(landmarks, W, H) {
        const toPx = (p) => ({ x: p.x * W, y: p.y * H });
        const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        const eyeR = toPx(landmarks[EYE_R_OUTER]);
        const eyeL = toPx(landmarks[EYE_L_OUTER]);
        const iod = Math.hypot(eyeL.x - eyeR.x, eyeL.y - eyeR.y) || 1;
        const uHat = { x: (eyeL.x - eyeR.x) / iod, y: (eyeL.y - eyeR.y) / iod };
        const vHat = { x: uHat.y, y: -uHat.x };
        const feature = (moving, anchor) => {
          const dx = moving.x - anchor.x;
          const dy = moving.y - anchor.y;
          return {
            u: (dx * uHat.x + dy * uHat.y) / iod,
            v: (dx * vHat.x + dy * vHat.y) / iod,
          };
        };
        const eyeCenterL = mid(eyeL, toPx(landmarks[EYE_L_INNER]));
        const eyeCenterR = mid(eyeR, toPx(landmarks[EYE_R_INNER]));
        // v2 anchors: mouth/lip use same-side eye centers (geometry.ts candidate
        // face-local-vector-v2), nose tip removed (off-plane yaw artifact).
        return {
          REGION_BROW: {
            left: feature(toPx(landmarks[BROW_L]), eyeCenterL),
            right: feature(toPx(landmarks[BROW_R]), eyeCenterR),
          },
          REGION_EYELID: {
            left: feature(toPx(landmarks[LID_UPPER_L]), toPx(landmarks[LID_LOWER_L])),
            right: feature(toPx(landmarks[LID_UPPER_R]), toPx(landmarks[LID_LOWER_R])),
          },
          REGION_MOUTH_CORNER: {
            left: feature(toPx(landmarks[MOUTH_L]), eyeCenterL),
            right: feature(toPx(landmarks[MOUTH_R]), eyeCenterR),
          },
          REGION_LIP: {
            left: feature(toPx(landmarks[LIP_L]), eyeCenterL),
            right: feature(toPx(landmarks[LIP_R]), eyeCenterR),
          },
        };
      }

      async function init() {
        setStatus('init');
        const fileset = await FilesetResolver.forVisionTasks('/wasm');
        try {
          landmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate: 'GPU' },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFacialTransformationMatrixes: true,
            outputFaceBlendshapes: true,
            minFaceDetectionConfidence: 0.5,
            minFacePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
        } catch {
          landmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate: 'CPU' },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFacialTransformationMatrixes: true,
            outputFaceBlendshapes: true,
            minFaceDetectionConfidence: 0.5,
            minFacePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,
          });
        }
        setStatus('ready');
        return true;
      }

      async function sampleVideo(url, sampleEveryMs = 100) {
        if (!landmarker) throw new Error('not initialized');
        setStatus('loading ' + url);
        video.src = url;
        video.muted = true;
        video.playsInline = true;
        await new Promise((resolve, reject) => {
          video.onloadeddata = () => resolve();
          video.onerror = () => reject(new Error('video load failed: ' + url));
        });
        await video.play();

        const rows = [];
        resetJitterState();
        let t = 0;
        const durationMs = (video.duration || 0) * 1000;
        // Seek-sample rather than real-time play (faster, deterministic).
        video.pause();
        while (t <= durationMs) {
          await new Promise((resolve) => {
            const onSeeked = () => {
              video.removeEventListener('seeked', onSeeked);
              resolve();
            };
            video.addEventListener('seeked', onSeeked);
            video.currentTime = Math.min(t / 1000, Math.max(0, video.duration - 0.001));
          });

          // Monotonic clock for MediaPipe VIDEO mode (not video currentTime).
          const timestampMs = nextTimestampMs;
          nextTimestampMs += sampleEveryMs;
          let result;
          try {
            result = landmarker.detectForVideo(video, timestampMs);
          } catch (err) {
            rows.push({
              timestampMs: t,
              qualityState: 'FACE_LOST',
              facePresent: false,
              features: null,
              error: String(err?.message ?? err),
            });
            t += sampleEveryMs;
            continue;
          }

          const faceLandmarks = result.faceLandmarks[0] ?? [];
          const matrix = result.facialTransformationMatrixes[0]?.data ?? [];
          const blendshapes = {};
          for (const c of result.faceBlendshapes?.[0]?.categories ?? []) {
            blendshapes[c.categoryName] = c.score;
          }
          const lf = {
            landmarks: faceLandmarks.map((p) => ({ x: p.x, y: p.y, z: p.z })),
            headPose: Array.from(matrix),
            facePresent: faceLandmarks.length > 0,
            timestampMs: t,
          };
          const pose = poseAnglesDeg(lf.headPose);
          const W = video.videoWidth || 640;
          const H = video.videoHeight || 480;
          const q = qualityState(lf, W, H);
          rows.push({
            timestampMs: t,
            qualityState: q,
            facePresent: lf.facePresent,
            yawDeg: pose.yaw,
            pitchDeg: pose.pitch,
            rollDeg: pose.roll,
            features: q === 'QUALITY_OK' ? measureAbsolutePx(lf.landmarks, W, H) : null,
            blendshapes: q === 'QUALITY_OK' ? blendshapes : null,
          });
          t += sampleEveryMs;
        }

        setStatus('done ' + url);
        return {
          url,
          durationMs,
          width: video.videoWidth,
          height: video.videoHeight,
          rows,
        };
      }

      window.__v1 = { init, sampleVideo };
      setStatus('script-loaded');
    </script>
  </body>
</html>
